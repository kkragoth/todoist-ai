[project]
name = "cli"
version = "0.1.0"
description = "Todoist AI CLI — minimal ReAct agent over MCP (Ollama qwen3.8:27b)"
readme = "README.md"
authors = [
    { name = "Piotr Szulc", email = "kkragoth@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain[mcp]>=1.4.0",
    "langchain-ollama>=1.1.0",
    "mcp>=2.2.0",
    "requests>=2.34.2",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
