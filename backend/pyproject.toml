[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Piotr Szulc", email = "kkragoth@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt==4.0.1",
    "fastapi[standard]>=0.141.1",
    "fastmcp>=4.0.3",
    "PyJWT>=2.8",
    "langchain>=1.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.0.0",
    "passlib>=1.7.4",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

# [project.scripts]
# backend = "backend:main"
[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
